<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeitklang — QR-Scan</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #191414;
            color: #fff;
        }
        button {
            font-size: 1.1rem;
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            background: #1db954;
            color: #191414;
            font-weight: bold;
        }
        #reader { margin-top: 16px; width: 100%; }
        #result {
            margin-top: 16px;
            font-size: 1rem;
            word-break: break-all;
        }
        #status {
            margin-top: 16px;
            color: #ff9999;
            word-break: break-all;
        }
        input {
            display: block;
            margin-top: 16px;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        #play-url { margin-top: 8px; }
        details { margin-top: 16px; }
        summary { cursor: pointer; color: #aaa; }
        #track { margin: 8px 0 0; font-size: 1.1rem; }
        #toggle { margin-top: 16px; }
        #logout { margin-top: 24px; }
    </style>
</head>
<body>
    <h1>Zeitklang</h1>
    <!-- Zustände §6: nicht angemeldet → Login; angemeldet → Scan -->
    <section id="login" hidden>
        <button id="login-button">Mit Spotify anmelden</button>
    </section>
    <section id="scan" hidden>
        <button id="start">Scan starten</button>
        <div id="reader"></div>
        <p id="result"></p>
        <input id="track-url" type="url" placeholder="Spotify-URL einfügen">
        <button id="play-url">Abspielen</button>
        <!-- Spoiler: Im Quiz darf die Lösung nicht sofort sichtbar sein. -->
        <details id="spoiler">
            <summary>Titel &amp; Interpret anzeigen</summary>
            <p id="track"></p>
        </details>
        <button id="toggle" hidden>▶</button>
        <button id="logout">Abmelden</button>
    </section>
    <p id="status"></p>
    <script src="config.js"></script>
    <script src="vendor/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
    <!-- SDK nach app.js: ruft window.onSpotifyWebPlaybackSDKReady auf -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
