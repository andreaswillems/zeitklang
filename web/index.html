<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e0e0e">
    <title>Zeitklang</title>
    <!-- #5: Meta-Beschreibung + Open-Graph/Twitter-Tags für Link-Previews -->
    <meta name="description" content="Musik-Quiz mit QR-Karten: Karte scannen, der Song spielt auf deinem Handy, Titel und Interpret ordnest du ein. Benötigt Spotify Premium.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Zeitklang">
    <meta property="og:title" content="Zeitklang · Das Musik-Quiz mit QR-Karten">
    <meta property="og:description" content="Musik-Quiz mit QR-Karten: Karte scannen, der Song spielt auf deinem Handy, Titel und Interpret ordnest du ein. Benötigt Spotify Premium.">
    <meta property="og:url" content="https://andreaswillems.github.io/zeitklang/">
    <meta property="og:image" content="https://andreaswillems.github.io/zeitklang/icons/icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="Zeitklang-App-Icon auf dunklem Hintergrund">
    <meta property="og:locale" content="de_DE">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Zeitklang · Das Musik-Quiz mit QR-Karten">
    <meta name="twitter:description" content="Musik-Quiz mit QR-Karten: Karte scannen, der Song spielt auf deinem Handy, Titel und Interpret ordnest du ein. Benötigt Spotify Premium.">
    <meta name="twitter:image" content="https://andreaswillems.github.io/zeitklang/icons/icon-512.png">
    <!-- #5: Apple-PWA-Metas, passend zum Manifest (display: standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zeitklang">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
    <header>
        <h1>Zeitklang</h1>
        <!-- #38: Abmelden als Icon-Button oben rechts — globales Element,
             app.js blendet ihn nur in der Scan-Ansicht ein (show()); die
             Login-Ansicht braucht kein Abmelden. -->
        <button id="logout" hidden aria-label="Abmelden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </button>
    </header>
    <main>
        <!-- #8: Ladezustand — als einziger Bereich ohne hidden direkt
             sichtbar, sobald die Seite malt; show() in app.js blendet ihn
             aus, sobald die Ziel-Ansicht feststeht. Verhindert den leeren
             Screen, während nach dem OAuth-Redirect der Token-Austausch
             (oder -Refresh) läuft. -->
        <section id="loading" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <p>Anmeldung läuft…</p>
        </section>
        <!-- Zustände §6: nicht angemeldet → Login; angemeldet → Scan -->
        <section id="login" hidden>
            <!-- #57: Wortmarke als zentrierter visueller Anker des Login-Screens;
                 das Header-h1 ist hier per CSS (:has()) ausgeblendet. -->
            <h2 class="wordmark">Zeitklang</h2>
            <!-- #57: dezente Equalizer-Deko, rein dekorativ (Muster .eq) -->
            <div class="login-eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <p class="hero-text">Melde dich an, scanne eine Karte und das Lied spielt auf deinem Handy.</p>
            <!-- #57: Spotify-Branding — Logo-SVG im Stil der bestehenden
                 Icons; Optik (Grün #1DB954, Text #191414) in style.css. -->
            <button id="login-button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                <span id="login-label">Mit Spotify anmelden</span>
            </button>
            <!-- #58: Fehlerbereich mit „Erneut versuchen“ — init() bzw. der
                 account_error-Fall (Premium) zeigen hier gezielte Meldungen
                 (app.js); ersetzt die reine Statuszeile im Fehlerfall. -->
            <div id="login-error" hidden role="alert">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                <p id="login-error-text"></p>
                <button id="login-retry" class="ghost">Erneut versuchen</button>
            </div>
            <!-- #57: Premium-Hinweis als Badge mit Link (Kontrast s. style.css) -->
            <p class="badge">Benötigt <a href="https://www.spotify.com/premium/" target="_blank" rel="noopener">Spotify Premium</a>.</p>
        </section>
        <!-- Seite 2: Scan (§6.2) -->
        <section id="scan" hidden>
            <!-- #45/#47/#62: Kamerabild + Overlay-Buttons in einem Anker-Wrapper —
                 Torch oben links (#3), Scan-Stopp oben rechts (#45). Solange
                 der Scanner gestoppt ist, füllt eine Platzhalter-Fläche den
                 Bereich; der Start-Button (#62) liegt fixiert in der Daumenzone
                 unten (style.css). -->
            <div id="reader-wrap">
                <div id="reader"></div>
                <!-- #3: Taschenlampe für dunkle Umgebung; hidden bis der
                     Torch-Support des Geräts erkannt wurde. -->
                <button id="torch" hidden aria-pressed="false" aria-label="Taschenlampe">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8v4l-2.5 3v11a1.5 1.5 0 0 1-3 0V9L8 6V2z"/></svg>
                </button>
                <!-- #45: Scanner manuell stoppen — Kamera aus, Start-Button
                     kehrt zurück; Muster wie Torch (#3). -->
                <button id="scan-stop" hidden aria-label="Scan stoppen">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
                <!-- #62: QR-Icon-Button mit Text „Scannen“ in der Daumenzone
                     (style.css, Muster #login-button/#56); ausgeblendet, solange
                     der Scanner läuft (app.js). Der sichtbare Text ist der
                     zugängliche Name — ein aria-label entfällt bewusst
                     (WCAG 2.5.3 „Label in Name“). -->
                <button id="start">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5,6.5v3h-3v-3H9.5 M11,5H5v6h6V5L11,5z M9.5,14.5v3h-3v-3H9.5 M11,13H5v6h6V13L11,13z M17.5,6.5v3h-3v-3H17.5 M19,5h-6v6 h6V5L19,5z M13,13h1.5v1.5H13V13z M14.5,14.5H16V16h-1.5V14.5z M16,13h1.5v1.5H16V13z M13,16h1.5v1.5H13V16z M14.5,17.5H16V19h-1.5 V17.5z M16,16h1.5v1.5H16V16z M17.5,14.5H19V16h-1.5V14.5z M17.5,17.5H19V19h-1.5V17.5z M22,7h-2V4h-3V2h5V7z M22,22v-5h-2v3h-3v2 H22z M2,22h5v-2H4v-3H2V22z M2,2v5h2V4h3V2H2z"/></svg>
                    <span>Scannen</span>
                </button>
            </div>
            <p id="result" role="status"></p>
        </section>
        <!-- #37: Player als Bottom-Sheet über dem Scanner — kein View-Wechsel
             mehr. Now-Playing-Karte (inkl. #13-Enthüllung) und Spoiler leben
             unverändert in diesem Sheet; der Scanner läuft dahinter weiter,
             ein neuer Scan schließt das Sheet automatisch (app.js).
             id nicht "player" nennen: window.player ist der SDK-Player. -->
        <div id="sheet-backdrop" hidden></div>
        <section id="player-sheet" hidden role="dialog" aria-modal="true"
                 aria-label="Aktueller Song">
            <button id="sheet-close" class="ghost" aria-label="Player schließen">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17 5 10h14z"/></svg>
            </button>
            <div id="now-playing">
                <img id="cover" alt="Album-Cover" width="92" height="92">
                <div class="np-meta">
                    <div class="eq" aria-hidden="true"><span></span><span></span><span></span></div>
                    <p id="np-title"></p>
                    <p id="np-artist"></p>
                </div>
                <button id="toggle" hidden aria-label="Wiedergabe fortsetzen">
                    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
            </div>
            <!-- Spoiler: Im Quiz darf die Lösung nicht sofort sichtbar sein. -->
            <details id="spoiler">
                <summary class="ghost">Titel &amp; Interpret anzeigen</summary>
            </details>
        </section>
        <!-- #7: Persistenter Mini-Player — aus jeder Ansicht erreichbar,
             solange ein Track geladen ist; #37: solange das Sheet offen ist,
             ist die Leiste redundant. Titel/Interpret bleiben hinter dem
             Spoiler-Blur. -->
        <div id="mini-player" hidden>
            <button id="mini-open" aria-label="Aktuellen Song im Player anzeigen">
                <img id="mini-cover" alt="" width="44" height="44">
                <span class="mini-meta">
                    <span id="mini-title"></span>
                    <span id="mini-artist"></span>
                </span>
            </button>
            <button id="mini-toggle" hidden aria-label="Wiedergabe fortsetzen">
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>
        </div>
        <p id="status" role="alert"></p>
    </main>
    <script src="config.js"></script>
    <script src="vendor/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
    <!-- SDK nach app.js: ruft window.onSpotifyWebPlaybackSDKReady auf -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>

</html>
