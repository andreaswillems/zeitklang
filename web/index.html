<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e0e0e">
    <title>Zeitklang</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
    <header>
        <h1>Zeitklang</h1>
        <p class="tagline">Scannen · Hören · Einordnen</p>
    </header>
    <main>
        <!-- Zustände §6: nicht angemeldet → Login; angemeldet → Scan -->
        <section id="login" hidden>
            <p class="hero-text">Melde dich an, scanne eine Karte und das Lied spielt auf deinem Handy.</p>
            <button id="login-button" class="primary">Mit Spotify anmelden</button>
            <p class="hint">Benötigt Spotify Premium.</p>
        </section>
        <!-- Seite 2: Scan (§6.2) -->
        <section id="scan" hidden>
            <p id="counter"></p>
            <button id="start" class="primary">Scan starten</button>
            <div id="reader"></div>
            <!-- #3: Taschenlampe für dunkle Umgebung; hidden bis der
                 Torch-Support des Geräts erkannt wurde. -->
            <button id="torch" class="ghost" hidden aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8v4l-2.5 3v11a1.5 1.5 0 0 1-3 0V9L8 6V2z"/></svg>
                Licht
            </button>
            <p id="result" role="status"></p>
            <button id="logout" class="ghost">Abmelden</button>
        </section>
        <!-- Seite 3: Player (§6.3) — Song-Infos hinter Spoiler.
             id nicht "player" nennen: window.player ist der SDK-Player. -->
        <section id="player-view" hidden>
            <div id="now-playing">
                <img id="cover" alt="Album-Cover" width="92" height="92">
                <div class="np-meta">
                    <div class="eq" aria-hidden="true"><span></span><span></span><span></span></div>
                    <p id="np-title"></p>
                    <p id="np-artist"></p>
                </div>
                <button id="toggle" hidden aria-label="Wiedergabe fortsetzen">
                    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
            </div>
            <!-- Spoiler: Im Quiz darf die Lösung nicht sofort sichtbar sein. -->
            <details id="spoiler">
                <summary class="ghost">Titel &amp; Interpret anzeigen</summary>
            </details>
            <button id="next-card" class="primary">Weitere Karte scannen</button>
        </section>
        <!-- #7: Persistenter Mini-Player — aus jeder Ansicht erreichbar,
             solange ein Track geladen ist; in der Player-Ansicht ausgeblendet
             (redundant). Titel/Interpret bleiben hinter dem Spoiler-Blur. -->
        <div id="mini-player" hidden>
            <button id="mini-open" aria-label="Aktuellen Song in der Player-Ansicht anzeigen">
                <img id="mini-cover" alt="" width="44" height="44">
                <span class="mini-meta">
                    <span id="mini-title"></span>
                    <span id="mini-artist"></span>
                </span>
            </button>
            <button id="mini-toggle" hidden aria-label="Wiedergabe fortsetzen">
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>
        </div>
        <p id="status" role="alert"></p>
    </main>
    <script src="config.js"></script>
    <script src="vendor/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
    <!-- SDK nach app.js: ruft window.onSpotifyWebPlaybackSDKReady auf -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>

</html>
