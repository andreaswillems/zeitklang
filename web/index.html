<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e0e0e">
    <title>Zeitklang</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
    <header>
        <h1>Zeitklang</h1>
        <p class="tagline">Scannen · Hören · Einordnen</p>
    </header>
    <main>
        <!-- Zustände §6: nicht angemeldet → Login; angemeldet → Scan -->
        <section id="login" hidden>
            <p class="hero-text">Melde dich an, scanne eine Karte und das Lied spielt auf deinem Handy.</p>
            <button id="login-button" class="primary">Mit Spotify anmelden</button>
            <p class="hint">Benötigt Spotify Premium.</p>
        </section>
        <!-- Seite 2: Scan (§6.2) -->
        <section id="scan" hidden>
            <p id="counter"></p>
            <button id="start" class="primary">Scan starten</button>
            <div id="reader"></div>
            <p id="result" role="status"></p>
            <input id="track-url" type="url" placeholder="Spotify-URL einfügen" autocomplete="off">
            <button id="play-url" class="ghost">Abspielen</button>
            <button id="logout" class="ghost">Abmelden</button>
        </section>
        <!-- Seite 3: Player (§6.3) — Song-Infos hinter Spoiler.
             id nicht "player" nennen: window.player ist der SDK-Player. -->
        <section id="player-view" hidden>
            <div id="now-playing">
                <img id="cover" alt="Album-Cover" width="92" height="92">
                <div class="np-meta">
                    <div class="eq" aria-hidden="true"><span></span><span></span><span></span></div>
                    <p id="np-title"></p>
                    <p id="np-artist"></p>
                </div>
                <button id="toggle" hidden>▶</button>
            </div>
            <!-- Spoiler: Im Quiz darf die Lösung nicht sofort sichtbar sein. -->
            <details id="spoiler">
                <summary>Titel &amp; Interpret anzeigen</summary>
            </details>
            <button id="next-card" class="primary">Weitere Karte scannen</button>
        </section>
        <p id="status" role="alert"></p>
    </main>
    <script src="config.js"></script>
    <script src="vendor/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
    <!-- SDK nach app.js: ruft window.onSpotifyWebPlaybackSDKReady auf -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>

</html>
