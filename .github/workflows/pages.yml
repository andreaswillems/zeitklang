name: Deploy PWA to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deploy-pages@v4 bricht ab, wenn im Lauf mehrere "github-pages"-
      # Artefakte liegen (z. B. nach Abbruch/Re-Run, Fehler s. Actions-Run #24:
      # "Multiple artifacts named github-pages ... Artifact count is 3").
      # Vor dem Upload alle vorhandenen Artefakte dieses Laufs löschen.
      - uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: context.runId,
            });
            for (const a of artifacts.data.artifacts.filter(a => a.name === "github-pages")) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
              core.info("Deleted stale artifact " + a.id);
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
