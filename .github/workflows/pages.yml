name: Deploy PWA to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  # Artifact-Cleanup-Step (github-script) loescht stale Artefakte dieses
  # Laufs vor dem Upload — dafür braucht das Token actions-Schreibrechte.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Actions auf Commit-SHA gepinnt (OWASP A03, ZQ59ZD3-1) — Major-Tag als
      # Kommentar. Node-24-Versionen (Node-20-Deprecation 2025-09-19).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .tool-versions (Repo-Root) ist die einzige Node-Versions-Quelle.
      # v5+: kein Auto-Caching — package.json hat kein packageManager-Feld.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      # HUSKY=0: Hooks im CI aus (prepare: husky läuft sonst vergeblich).
      - run: HUSKY=0 npm ci
      # Baut die App nach dist/.
      - run: npm run build
      # deploy-pages bricht ab, wenn im Lauf mehrere "github-pages"-
      # Artefakte liegen (z. B. nach Abbruch/Re-Run). Vor dem Upload alle
      # vorhandenen Artefakte dieses Laufs löschen.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: context.runId,
            });
            for (const a of artifacts.data.artifacts.filter(a => a.name === "github-pages")) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
              core.info("Deleted stale artifact " + a.id);
            }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
