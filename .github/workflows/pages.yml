name: Deploy PWA to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # deploy-pages@v4 bricht ab, wenn im Lauf mehrere "github-pages"-
      # Artefakte liegen (z. B. nach Abbruch/Re-Run, Fehler s. Actions-Run #24:
      # "Multiple artifacts named github-pages ... Artifact count is 3").
      # Vor dem Upload alle vorhandenen Artefakte dieses Laufs löschen.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: context.runId,
            });
            for (const a of artifacts.data.artifacts.filter(a => a.name === "github-pages")) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
              core.info("Deleted stale artifact " + a.id);
            }
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
