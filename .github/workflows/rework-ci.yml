name: PWA CI

# Prüft die App (Lint, Audit, Types, Tests, Build, Secret-Scan) bei jedem
# Push und Pull-Request.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rework-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions auf Commit-SHA gepinnt (OWASP A03, ZQ59ZD3-1) — Major-Tag als
      # Kommentar. Node-24-Versionen (Node-20-Deprecation 2025-09-19).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .tool-versions (Repo-Root) ist die einzige Node-Versions-Quelle.
      # v5+: kein Auto-Caching — package.json hat kein packageManager-Feld.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      # HUSKY=0: Hooks im CI aus (prepare: husky läuft sonst vergeblich).
      - run: HUSKY=0 npm ci
      # Voller Deps-Audit inkl. dev (OWASP A03, ZQ59ZD3-1 + 6GF4NME): prod-only
      # reichte bis 6GF4NME; seitdem gilt `npm audit` exit 0 fuer prod UND dev
      # (glob/minimatch via workbox-build per npm override auf glob ^14.0.6 gefixt).
      - run: npm audit
      - run: npm run ci          # Biome: Lint + Format + Imports (Exit != 0 bei Befunden)
      - run: npm run typecheck   # tsc --noEmit
      - run: npm test            # vitest run
      - run: npm run build       # Build-Smoke
      # Secret-Scan über das ganze Repo (src, dist, scripts, public/, .github/, .husky/)
      - run: npm run check:secrets
        env:
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          # Explizites CI: check-secrets.mjs exit 1 (fail-hard), wenn das Secret in CI fehlt (ZF96RD7).
          CI: "true"
