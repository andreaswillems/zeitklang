name: rework CI (PWA-Rebuild)

# Parallelbetrieb: Pages deployt weiter web/ (pages.yml) — dieser Workflow
# prüft nur die neue App in rework/ (docs/pwa-rebuild.md §4).
on:
  push:
    paths:
      - "rework/**"
      - ".husky/**"
      - ".github/workflows/rework-ci.yml"
  pull_request:
    paths:
      - "rework/**"
      - ".husky/**"
      - ".github/workflows/rework-ci.yml"

permissions:
  contents: read

concurrency:
  group: rework-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rework
    steps:
      - uses: actions/checkout@v4
      # .tool-versions (Repo-Root) ist die einzige Node-Versions-Quelle.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      # HUSKY=0: Hooks im CI aus (prepare: husky läuft sonst vergeblich).
      - run: HUSKY=0 npm ci
      - run: npm run ci          # Biome: Lint + Format + Imports (Exit != 0 bei Befunden)
      - run: npm run typecheck   # tsc --noEmit
      - run: npm test            # vitest run
      - run: npm run build       # Build-Smoke
      # Secret-Scan auf rework/src + rework/dist (Python-frei, ersetzt langfristig test_web_assets.py)
      - run: npm run check:secrets
        env:
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
