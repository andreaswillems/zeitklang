# Dependabot-Konfiguration (OWASP A03 F2 — Subtask ZQ59ZD3-2).
#
# Zwei Ökosysteme, beide mit directory "/" (Repo-Root):
#  - github-actions — deckt ALLE Workflows in .github/workflows/ ab
#    (rework-ci.yml UND pages.yml).
#  - npm — package.json liegt im Repo-Root.
version: 2

updates:
  # Actions aller Workflows (directory "/" = .github/workflows/*).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # npm (package.json im Repo-Root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
