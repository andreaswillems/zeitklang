[project]
name = "zeitklang"
version = "0.1.0"
description = "Musik-Quiz: Song-Sammlungen abrufen und druckbare QR-Karten-PDFs generieren"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1.3",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "qrcode>=8.2",
    "reportlab>=5.1.0",
    "spotify-sdk>=0.10.1",
]

[project.scripts]
zeitklang = "zeitklang.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/zeitklang"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
src = ["app"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# HTML-Template mit SVG-Paths und Spotify-API-"fields"-Strings
"app/zeitklang/auth/app.py" = ["E501"]
