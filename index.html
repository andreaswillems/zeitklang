<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <!-- Zoom-Lock für iOS: Nur im standalone-Modus (Home-Bildschirm-App)
         respektiert WebKit maximum-scale/user-scalable und sperrt Pinch-Zoom;
         im Safari-Tab ignoriert iOS die Attribute seit iOS 10 (Accessibility).
         Doppel-Tap-Zoom unterdrückt zusätzlich touch-action: manipulation
         in global.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- #78: Meta-CSP + Referrer-Policy — GitHub Pages setzt keine Security-Header,
         Meta-Tags am Head-Anfang sind die einzige Absicherung (Details: Issue #78).
         #92: frame-src für den SDK-iframe (sdk.scdn.co/embedded/index.html) —
         ohne diese Direktive blockiert default-src 'self' die Wiedergabe-Engine.
         worker-src braucht 'self': Service-Worker-Skripte (sw.js) werden von
         worker-src governed — nur blob: hätte die Registrierung von sw.js
         blockiert (Console: "blocked a worker script … violates worker-src"). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://sdk.scdn.co; frame-src https://sdk.scdn.co; style-src 'self'; img-src 'self' https://*.scdn.co data:; connect-src 'self' https://accounts.spotify.com https://api.spotify.com https://*.spotify.com wss://*.spotify.com; media-src blob: https://*.spotify.com; worker-src blob: 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#0e0e0e">
    <title>Zeitklang</title>
    <!-- #5: Meta-Beschreibung + Open-Graph/Twitter-Tags für Link-Previews -->
    <meta name="description" content="Scanner-Player mit QR-Karten: Karte scannen, der Song spielt auf deinem Handy; Titel und Interpret erscheinen hinter einem Spoiler. Benötigt Spotify Premium.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Zeitklang">
    <meta property="og:title" content="Zeitklang · Scanner-Player mit QR-Karten">
    <meta property="og:description" content="Scanner-Player mit QR-Karten: Karte scannen, der Song spielt auf deinem Handy; Titel und Interpret erscheinen hinter einem Spoiler. Benötigt Spotify Premium.">
    <meta property="og:url" content="https://andreaswillems.github.io/zeitklang/">
    <meta property="og:image" content="https://andreaswillems.github.io/zeitklang/icons/icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="Zeitklang-App-Icon auf dunklem Hintergrund">
    <meta property="og:locale" content="de_DE">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Zeitklang · Scanner-Player mit QR-Karten">
    <meta name="twitter:description" content="Scanner-Player mit QR-Karten: Karte scannen, der Song spielt auf deinem Handy; Titel und Interpret erscheinen hinter einem Spoiler. Benötigt Spotify Premium.">
    <meta name="twitter:image" content="https://andreaswillems.github.io/zeitklang/icons/icon-512.png">
    <!-- #5: Apple-PWA-Metas, passend zum Manifest (display: standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zeitklang">
    <!-- Kein Stylesheet-Link: Vite bündelt das CSS;
         das Spotify-SDK lädt der Adapter per document.createElement — die CSP bleibt valide. -->
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
    <!-- #8/XQSXXEX: Statischer Pre-JS-Ladezustand (Parity web/index.html L60–63) —
         sichtbar ab First Paint, main.tsx ersetzt ihn beim Mount durch die App. -->
    <div id="app">
        <section id="loading" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <p>Anmeldung läuft…</p>
        </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
